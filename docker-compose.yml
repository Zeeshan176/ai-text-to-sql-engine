version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vol:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"

volumes:
  pgdata_vol: